# 专家库系统后端配置（正式版 V1.001）
# 注意：数据库账号/密码等敏感信息通过环境变量注入，禁止硬编码提交到仓库
server:
  port: 8080
  # 内网部署：仅监听内网地址，防止暴露公网
  address: 0.0.0.0

spring:
  config:
    import: classpath:version.properties
  application:
    name: expert-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:expert_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      # 上传大小限制（照片单文件 ≤5MB；知识文档单文件 ≤50MB，请求 ≤60MB）
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jshz.expert.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ------------------------------------------------------------
# 正式版 V1.001 自定义配置
# 环境相关路径约定：默认值仅为本机当前值兜底，运维可通过环境变量覆盖
# （STORAGE_ROOT 一次覆盖全部存储根；各 *_STORAGE_DIR 可单独覆盖）
# ------------------------------------------------------------
# CORS 白名单：内网固定前端来源，逗号分隔；配合 allowCredentials(true) 不得使用 *
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://192.168.0.95:5173,http://localhost:5173,http://192.168.0.144:5173}
expert:
  # 照片存储根目录（设计文档：D:\jshz-PMO\照片库）
  photo:
    storage-dir: '${STORAGE_ROOT:D:\jshz-PMO}\照片库'
    # 审批流临时照片目录（需求3：提交申请前预上传，审批通过后归档到正式照片库）
    temp-dir: '${STORAGE_ROOT:D:\jshz-PMO}\照片库_tmp'
  # 知识文档存储根目录（知识星球：会议执行/协会合规要求/企业合规要求/客户喜好）
  knowledge:
    storage-dir: '${STORAGE_ROOT:D:\jshz-PMO}\知识文档库'
    # P2-7：知识文档正文抽取/合规解析异步线程池（上传请求不再同步 OCR）
    parse:
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
    # Office 文档转 PDF 预览缓存目录（LibreOffice 转换结果，按文档id+版本缓存）
    preview-dir: '${STORAGE_ROOT:D:\jshz-PMO}\知识文档库\_preview'
    # LibreOffice 可执行文件路径（doc/docx/xls/xlsx/ppt/pptx 在线预览转换）
    libreoffice-path: ${LIBREOFFICE_PATH:C:\Program Files\LibreOffice\program\soffice.com}
  # 企业合规：到期提醒定时任务（每日 08:30；个人提醒+全局责任人提醒，幂等去重）
  compliance:
    # V4 is opt-in by environment AND explicit per-user cutover after migration.
    v4-enabled: ${COMPLIANCE_V4_ENABLED:false}
    v4-reminder-enabled: ${COMPLIANCE_V4_REMINDER_ENABLED:false}
    due-enabled: true
    due-cron: "0 30 8 * * ?"
    # 全局责任人提醒提前天数
    assignee-days: 3
  # 供应商图片存储根目录（前端压缩后上传，多图画廊展示）
  # 客户附件存储根目录（客户信息模块：客户档案附件，独立目录）
  customer:
    storage-dir: '${STORAGE_ROOT:D:\jshz-PMO}\客户附件库'
  supplier:
    storage-dir: '${STORAGE_ROOT:D:\jshz-PMO}\供应商图库'
  # 项目资料存储根目录（项目管理模块：分阶段资料 + 富文本内容 + 合同文件）
  project:
    storage-dir: '${STORAGE_ROOT:D:\jshz-PMO}\项目资料库'
  # 上传限额单一真源（方案 D，2026-11-13）：前端经 GET /api/meta/limits 读取做预校验，
  # 调整限额只改此处；前端兜底默认值见 frontend/src/utils/limits.js（须同步）
  upload:
    photo-max-bytes: 5242880        # 照片单文件 ≤5MB（照片/头像预校验）
    resume-max-bytes: 20971520      # 简历单文件 ≤20MB（批量建档）
    doc-max-bytes: 52428800         # 知识/项目资料/日程单文件 ≤50MB（multipart 上限见 spring.servlet.multipart）
  # 存储占用预警阈值（单目录字节；Owner 2026-11-12 存储管理工具）
  storage:
    warn-threshold-bytes: 10737418240      # 10GB 提醒
    critical-threshold-bytes: 21474836480  # 20GB 严重
  # JWT 登录鉴权
  # P1-2：登录态用户状态（存在/启用/token_version）短 TTL 缓存；停用/删除/改密/改角色时立即失效
  auth:
    state-cache-seconds: 60
  jwt:
    # 签名密钥必须由环境变量 JWT_SECRET 注入（≥32 字节随机串），禁止写入仓库；
    # 未注入时后端启动失败（HS256 密钥强度校验不通过），属预期 fail-fast 行为
    secret: ${JWT_SECRET:}
    expire-hours: 8
  # 企业微信通讯录同步（2026-10-27 评审通过，账号体系改造）
  wecom:
    # 企业 CorpID（企业微信管理后台-我的企业），必须由环境变量 WECOM_CORP_ID 注入，禁止写入仓库
    corp-id: ${WECOM_CORP_ID:}
    # 通讯录同步助手·只读 secret（管理工具-通讯录同步助手），必须由环境变量 WECOM_CONTACT_SECRET 注入
    contact-secret: ${WECOM_CONTACT_SECRET:}
    # 每日定时同步 cron（默认 02:30）
    sync-cron: "0 30 2 * * ?"
    # 定时同步开关：false=关闭（默认，上线稳定后由运维打开）；true 且 corp-id/secret 为空时启动失败（fail-fast）
    sync-cron-enabled: false
    # 登录标识模式：NAME（默认/回滚档）/ COMPAT（过渡）/ MOBILE（终态，本期目标）
    # 必须由环境变量 AUTH_LOGIN_MODE 注入（示例 CHANGE_ME）；非法值启动失败（fail-fast）
    login-mode: ${AUTH_LOGIN_MODE:NAME}

logging:
  level:
    com.jshz.expert: info

