# 专家库系统后端配置（正式版 V1.001）
# 注意：数据库账号/密码等敏感信息通过环境变量注入，禁止硬编码提交到仓库
server:
  port: 8080
  # 内网部署：仅监听内网地址，防止暴露公网
  address: 0.0.0.0

spring:
  application:
    name: expert-system
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:expert_system}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      # 上传大小限制（照片单文件 ≤5MB；知识文档单文件 ≤50MB，请求 ≤60MB）
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.jshz.expert.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ------------------------------------------------------------
# 正式版 V1.001 自定义配置
# ------------------------------------------------------------
expert:
  # 照片存储根目录（设计文档：D:\jshz-PMO\照片库）
  photo:
    storage-dir: 'D:\jshz-PMO\照片库'
    # 审批流临时照片目录（需求3：提交申请前预上传，审批通过后归档到正式照片库）
    temp-dir: 'D:\jshz-PMO\照片库_tmp'
  # 知识文档存储根目录（知识星球：会议执行/协会合规要求/企业合规要求/客户喜好）
  knowledge:
    storage-dir: 'D:\jshz-PMO\知识文档库'
  # JWT 登录鉴权
  jwt:
    # 签名密钥必须由环境变量 JWT_SECRET 注入（≥32 字节随机串），禁止写入仓库；
    # 未注入时后端启动失败（HS256 密钥强度校验不通过），属预期 fail-fast 行为
    secret: ${JWT_SECRET:}
    expire-hours: 8

logging:
  level:
    com.jshz.expert: info
