<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>景帅会展内部管理系统 - 管理端</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#f5f7fa; color:#333; }
/* 顶栏 */
.topbar { position:fixed; top:0; left:0; right:0; height:56px; background:#fff; border-bottom:1px solid #e6e8ee; display:flex; align-items:center; justify-content:space-between; padding:0 24px; z-index:100; }
.topbar .brand { display:flex; align-items:center; gap:10px; flex:none; }
.topbar .name { font-size:17px; font-weight:700; letter-spacing:1px; background:linear-gradient(135deg,#7c3aed,#a855f7 55%,#6366f1); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap; }
.topbar .user { display:flex; align-items:center; gap:8px; flex:none; cursor:pointer; }
.topbar .avatar { width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:15px; }
.topbar .uid { font-size:13px; color:#555; }
.topbar .arrow { font-size:10px; color:#999; }
/* 三段式布局 */
.layout { min-height:100vh; padding:56px 0 0 220px; }
/* 侧边栏（固定不随页面滚动） */
.sidebar { position:fixed; top:56px; left:0; bottom:0; width:220px; background:#0a1426; color:#cbd5e1; padding-top:20px; overflow-y:auto; }
.menu { list-style:none; }
.menu .item { display:flex; align-items:center; gap:12px; padding:14px 20px; font-size:14px; cursor:pointer; color:#cbd5e1; user-select:none; }
.menu .item:hover { background:rgba(255,255,255,.06); color:#fff; }
.menu .item.active { background:linear-gradient(90deg,rgba(124,58,237,.9),rgba(168,85,247,.7)); color:#fff; font-weight:600; border-radius:6px; margin:4px 10px; padding:14px 12px; }
.menu .ico { font-size:16px; }
.menu .arrow { margin-left:auto; font-size:10px; transition:transform .2s; }
.menu .sub { list-style:none; display:none; padding:6px 0 10px; }
.menu .sub .item { padding:12px 20px 12px 48px; font-size:13px; }
.menu .openable.open > .sub { display:block; }
.menu .openable.open > .item .arrow { transform:rotate(180deg); }
/* 主内容区 */
.main { flex:1; padding:28px 32px; }
/* 面板 */
.panel { background:#fff; border-radius:12px; padding:28px 26px; box-shadow:0 1px 6px rgba(16,24,40,.06); margin-bottom:24px; }
.panel h3 { font-size:17px; font-weight:700; margin-bottom:18px; }
.form-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px 20px; }
.form-grid label { display:block; font-size:13px; color:#555; margin-bottom:6px; }
.form-grid input, .form-grid textarea, .form-grid select { width:100%; height:38px; border:1px solid #d6dae3; border-radius:8px; padding:0 12px; font-size:14px; outline:none; }
.form-grid textarea { height:72px; padding:8px 12px; resize:vertical; }
.form-grid input:focus, .form-grid textarea:focus, .form-grid select:focus { border-color:#7c3aed; }
.btn-row { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
/* 按钮 */
.btn { height:36px; border:none; border-radius:8px; padding:0 16px; font-size:14px; cursor:pointer; color:#fff; background:#7c3aed; display:inline-flex; align-items:center; gap:6px; }
.btn:hover { opacity:.9; }
.btn.green { background:#16a34a; }
.btn.orange { background:#ea580c; }
.btn.gray { background:#64748b; }
.btn.red { background:#dc2626; }
.btn.small { height:32px; padding:0 12px; font-size:12px; border-radius:6px; }
/* 搜索与批量操作 */
.search-box { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
.search-box input { width:240px; height:38px; border:1px solid #d6dae3; border-radius:8px; padding:0 12px; font-size:14px; outline:none; }
.search-box input:focus { border-color:#7c3aed; }
.select-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.select-bar .info { font-size:13px; color:#555; margin-right:auto; }
/* 吸附工具栏（滚动时悬浮吸附在顶栏下方） */
.sticky-bar { position:sticky; top:64px; z-index:50; background:rgba(255,255,255,.95); border:1px solid #e6e8ee; border-radius:12px; padding:14px 18px; margin-bottom:20px; box-shadow:0 4px 16px rgba(16,24,40,.08); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.sticky-bar .info { margin-left:auto; }
.sticky-bar .search-box { margin-bottom:0; }
.hint { font-size:12px; color:#94a3b8; margin:12px 0 18px; }
/* 表格 */
.table-wrap { overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { border:1px solid #eef0f5; padding:12px 14px; text-align:left; white-space:nowrap; }
th { background:#f8f9fc; color:#444; font-weight:600; position:sticky; top:0; }
tr:hover td { background:#faf8ff; }
.photo { width:44px; height:44px; border-radius:50%; object-fit:cover; }
.thumb-empty { width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
.avatar-wrap { position:relative; width:44px; height:44px; display:inline-block; vertical-align:middle; }
.avatar-wrap > .thumb-empty, .avatar-wrap > .photo { position:absolute; inset:0; margin:0; }
.avatar-wrap img.photo { object-fit:cover; z-index:1; }
.num { font-family:Consolas,monospace; font-size:12px; color:#555; }
.masked { color:#94a3b8; font-family:Consolas,monospace; font-size:12px; }
/* 提示 */
.toast { position:fixed; left:50%; bottom:48px; transform:translateX(-50%); background:rgba(17,24,39,.92); color:#fff; padding:10px 20px; border-radius:8px; font-size:13px; z-index:999; opacity:0; pointer-events:none; transition:opacity .25s; }
.toast.show { opacity:1; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="name">景帅会展内部管理系统</div></div>
  <div class="user"><div class="avatar">☺</div><span class="uid">191036022</span><span class="arrow">▼</span></div>
</header>
<div class="layout">
  <aside class="sidebar">
    <ul class="menu">
      <li class="openable open">
        <div class="item" onclick="toggleMenu(this)"><span class="ico">▤</span><span class="txt">公司内部资料</span><span class="arrow">▼</span></div>
        <ul class="sub">
          <li><div class="item active" onclick="setActive(this)"><span class="txt">专家库</span></div></li>
        </ul>
      </li>
    </ul>
  </aside>
  <main class="main">
    <section class="panel">
      <h3>新增 / 编辑专家</h3>
      <div class="form-grid">
        <div><label>姓名 *</label><input id="f_name"></div>
        <div><label>单位</label><input id="f_unit"></div>
        <div><label>科室</label><input id="f_dept"></div>
        <div><label>职称</label><input id="f_title"></div>
        <div><label>研究方向</label><input id="f_field"></div>
        <div><label>擅长领域</label><input id="f_expertise"></div>
        <div><label>联系方式</label><input id="f_contact" placeholder="11位手机号或邮箱"></div>
        <div><label>身份证号</label><input id="f_id_card"></div>
        <div><label>银行卡号</label><input id="f_bank_card"></div>
        <div style="grid-column:1/-1;"><label>简介</label><textarea id="f_remark"></textarea></div>
      </div>
      <div class="btn-row">
        <button class="btn green" onclick="saveExpert()">保存</button>
        <button class="btn gray" onclick="resetForm()">清空</button>
      </div>
    </section>
    <section class="panel">
      <div class="sticky-bar">
        <div class="search-box">
          <input id="searchInput" placeholder="搜索姓名/单位/科室/职称/研究方向…" oninput="doSearch()">
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
        <span class="info"><label><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this)"> 全选</label></span>
        <button class="btn small" onclick="downloadSelectedCsv()">下载所选 CSV</button>
        <button class="btn small" onclick="downloadSelectedZip()">下载所选 ZIP</button>
        <button class="btn small green" onclick="downloadFullZip()">整库 ZIP</button>
        <button class="btn small" onclick="downloadCsv()">导出完整 CSV</button>
        <button class="btn small gray" onclick="downloadTemplate()">下载模板</button>
        <button class="btn small orange" onclick="downloadMd()">下载 MD</button>
        <button class="btn small red" onclick="copySelected()">一键复制</button>
      </div>
      <div class="hint">管理员视图：身份证/银行卡号完整可见；复制内容不含身份证号与银行卡号；支持 CSV 导入。</div>
      <div class="table-wrap">
        <table id="table">
          <thead>
            <tr>
              <th style="width:34px;"><input type="checkbox" id="selectAllHeader" onchange="toggleSelectAll(this)"></th>
              <th>头像</th><th>姓名</th><th>单位</th><th>科室</th><th>职称</th><th>研究方向</th><th>擅长领域</th><th>联系方式</th><th>身份证号</th><th>银行卡号</th><th>简介</th><th>修改时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" style="display:none;text-align:center;color:#94a3b8;padding:32px 0;">暂无匹配的专家</div>
      <div class="btn-row">
        <button class="btn red" onclick="deleteSelected()">批量删除所选</button>
        <button class="btn orange" onclick="document.getElementById('csvFile').click()">CSV 导入</button>
        <input type="file" id="csvFile" accept=".csv" style="display:none;" onchange="importCsv(this)">
      </div>
    </section>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
var all = [], selected = [];
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._timer); t._timer = setTimeout(function(){ t.classList.remove('show'); }, 2000); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function visibleItems(){ var kw = (document.getElementById('searchInput').value || '').trim().toLowerCase(); return all.filter(function(x){ if(!kw) return true; return ['姓名','单位','科室','职称','研究方向','擅长领域','联系方式'].some(function(v){ return String(x[v]||'').toLowerCase().indexOf(kw) > -1; }); }); }
function renderList(){ var items = visibleItems(); var tbody = document.getElementById('tbody'); var empty = document.getElementById('empty'); tbody.innerHTML = ''; if(!items.length){ empty.style.display = 'block'; } else { empty.style.display = 'none'; items.forEach(function(x){ var tr = document.createElement('tr'); var photo = x['照片'] || ''; tr.innerHTML =
  '<td><input type="checkbox" class="check" ' + (selected.indexOf(x.id) > -1 ? 'checked' : '') + ' onchange="toggleSel(' + x.id + ',this)"></td>' +
  '<td><div class="avatar-wrap"><div class="thumb-empty">' + esc(String(x['姓名']||'?').charAt(0)) + '</div>' + (photo ? '<img class="photo" src="/uploads/' + esc(photo) + '" onerror="this.style.display=\'none\'">' : '') + '</div></td>' +
  '<td>' + esc(x['姓名']) + '</td><td>' + esc(x['单位'] || '-') + '</td><td>' + esc(x['科室'] || '-') + '</td><td>' + esc(x['职称'] || '-') + '</td><td>' + esc(x['研究方向'] || '-') + '</td><td>' + esc(x['擅长领域'] || '-') + '</td>' +
  '<td>' + esc(x['联系方式'] || '-') + '</td>' +
  '<td class="num">' + esc(x['身份证号'] || '-') + '</td><td class="num">' + esc(x['银行卡号'] || '-') + '</td>' +
  '<td>' + esc(x['简介'] || '-') + '</td><td class="masked">' + esc(x['修改时间'] || '-') + '</td>' +
  '<td><button class="btn small" onclick="editExpert(' + x.id + ')">编辑</button> <button class="btn small red" onclick="delExpert(' + x.id + ')">删除</button></td>'; tbody.appendChild(tr); }); }
}
function load(){ fetch('/api/experts?sensitive=1').then(function(r){ return r.json(); }).then(function(data){ all = (data && data.items) || []; selected = []; renderList(); }).catch(function(){ toast('加载失败'); }); }
function doSearch(){ renderList(); }
function resetSearch(){ document.getElementById('searchInput').value = ''; renderList(); }
function toggleSel(id, el){ if(el.checked){ if(selected.indexOf(id) < 0) selected.push(id); } else { selected = selected.filter(function(v){ return v !== id; }); } updateSelCount(); }
function toggleSelectAll(src){ var items = visibleItems(); var el = src || document.getElementById('selectAll'); var checked = !!el.checked; if(checked){ items.forEach(function(x){ if(selected.indexOf(x.id) < 0) selected.push(x.id); }); } else { items.forEach(function(x){ selected = selected.filter(function(v){ return v !== x.id; }); }); } document.getElementById('selectAll').checked = checked; document.getElementById('selectAllHeader').checked = checked; renderList(); updateSelCount(); }
function updateSelCount(){ }
function selectedIds(){ return selected.map(String); }
function idsParam(){ var s = selectedIds(); return s.length ? ('&ids=' + s.join(',')) : ''; }
function hasSelection(){ if(!selected.length){ toast('请先选择专家'); return false; } return true; }
function downloadSelectedCsv(){ if(!hasSelection()) return; location.href = '/api/experts/selected/export?ids=' + selectedIds().join(',') + '&sensitive=1'; }
function downloadSelectedZip(){ if(!hasSelection()) return; location.href = '/api/experts/selected/zip?ids=' + selectedIds().join(',') + '&sensitive=1'; }
function downloadFullZip(){ location.href = '/api/export/full'; }
function downloadCsv(){ location.href = '/api/experts/export'; }
function downloadTemplate(){ location.href = '/api/experts/template'; }
function downloadMd(){ location.href = '/api/export/md?full=1'; }
function copySelected(){ if(!hasSelection()) return; var lines = selectedIds().map(function(id){ var x = all.find(function(o){ return String(o.id) === id; }); if(!x) return ''; return [x['姓名'], x['单位'], x['职称'], x['联系方式']].filter(Boolean).join(' | '); }).filter(Boolean).join('\n'); if(!lines){ toast('无内容可复制'); return; } fallbackCopy(lines); }
function fallbackCopy(text){ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(function(){ toast('已复制 ' + text.split('\n').length + ' 条'); }, function(){ legacyCopy(text); }); } else { legacyCopy(text); } }
function legacyCopy(text){ var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('已复制 ' + text.split('\n').length + ' 条'); }catch(e){ toast('复制失败，请手动复制'); } document.body.removeChild(ta); }
function resetForm(){ ['f_name','f_unit','f_dept','f_title','f_field','f_expertise','f_contact','f_id_card','f_bank_card','f_remark'].forEach(function(id){ document.getElementById(id).value = ''; }); window._editId = null; }
function editExpert(id){ var x = all.find(function(o){ return o.id === id; }); if(!x) return; window._editId = id; ['姓名','单位','科室','职称','研究方向','擅长领域','联系方式','身份证号','银行卡号','简介'].forEach(function(k){ document.getElementById('f_' + ({'姓名':'name','单位':'unit','科室':'dept','职称':'title','研究方向':'field','擅长领域':'expertise','联系方式':'contact','身份证号':'id_card','银行卡号':'bank_card','简介':'remark'})[k]).value = x[k] || ''; }); toast('正在编辑：' + x['姓名']); }
function collectForm(){ var d = {}; var map = {'f_name':'姓名','f_unit':'单位','f_dept':'科室','f_title':'职称','f_field':'研究方向','f_expertise':'擅长领域','f_contact':'联系方式','f_id_card':'身份证号','f_bank_card':'银行卡号','f_remark':'简介'}; Object.keys(map).forEach(function(id){ d[map[id]] = document.getElementById(id).value.trim(); }); return d; }
function saveExpert(){ var d = collectForm(); if(!d['姓名']){ toast('请填写姓名'); return; } var url = '/api/experts' + (window._editId ? '/' + window._editId : ''); var method = window._editId ? 'PUT' : 'POST'; fetch(url, { method:method, headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(d) }).then(function(r){ return r.json(); }).then(function(res){ toast(res.message || '保存成功'); resetForm(); load(); }).catch(function(){ toast('保存失败'); }); }
function delExpert(id){ if(!confirm('确认删除该专家？')) return; fetch('/api/experts/' + id, { method:'DELETE' }).then(function(r){ return r.json(); }).then(function(res){ toast(res.message || '已删除'); load(); }).catch(function(){ toast('删除失败'); }); }
function deleteSelected(){ if(!hasSelection()) return; if(!confirm('确认批量删除所选 ' + selected.length + ' 位专家？')) return; var ids = selected.slice(); var done = 0; function next(){ if(done >= ids.length){ toast('批量删除完成'); selected = []; load(); return; } var id = ids[done++]; fetch('/api/experts/' + id, { method:'DELETE' }).then(function(){ next(); }).catch(function(){ next(); }); } next(); }
function importCsv(input){ var file = input.files[0]; if(!file) return; var fd = new FormData(); fd.append('file', file); fetch('/api/experts/import', { method:'POST', body: fd }).then(function(r){ return r.json(); }).then(function(res){ toast(res.message || '导入完成'); input.value = ''; load(); }).catch(function(){ toast('导入失败'); }); }
function setActive(el){ document.querySelectorAll('.menu .item.active').forEach(function(i){ i.classList.remove('active'); }); el.classList.add('active'); }
function toggleMenu(el){ el.parentElement.classList.toggle('open'); }
load();
</script>
</body>
</html>
